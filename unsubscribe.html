<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unsubscribe | Fundly</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#020204" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="stylesheet" href="css/style.css?v=20261119a" />
  <link rel="stylesheet" href="css/legal.css?v=20261119a" />
  <script src="js/consent.js?v=20261119a"></script>
</head>
<body>
  <header class="nav scrolled">
    <div class="container nav-inner">
      <a href="./" class="logo" aria-label="Fundly, home">
        <img src="assets/logo.png" alt="" width="24" height="24" />
        fundly
      </a>
      <div class="nav-cta"><a class="btn btn-ghost" href="./" data-legal="back">Back to home</a></div>
    </div>
  </header>

  <main class="legal-main">
    <div class="container legal-wrap" style="text-align:center;max-width:520px">
      <h1 class="t-h2" id="unsubTitle">Unsubscribe</h1>
      <p id="unsubText" style="margin:14px 0 24px">Stop receiving Fundly promotional emails?</p>
      <button class="btn btn-primary" id="unsubBtn" type="button">Yes, unsubscribe me</button>
      <p class="auth-note mt" id="unsubNote" hidden></p>
      <p id="unsubFoot" style="margin-top:28px;font-size:.8125rem;color:var(--text-muted)">You'll still receive service emails about your account (payments, closed accounts, security). Changed your mind? Write to <a href="mailto:support@fundly.games">support@fundly.games</a>.</p>
    </div>
  </main>

  <script src="js/config.js?v=20261119a"></script>
  <script>
    (function () {
      // jazyk jako na zbytku webu (fundly:lang, jinak jazyk prohlížeče); sk/cs → česky
      var lang = "en";
      try { lang = localStorage.getItem("fundly:lang") || (navigator.language || "en").slice(0, 2); } catch (e) { /* */ }
      var CS = lang === "cs" || lang === "sk";
      var T = CS ? {
        title: "Odhlášení z e-mailů", text: "Přestat dostávat propagační e-maily od Fundly?", btn: "Ano, odhlásit mě",
        foot: "Servisní e-maily o tvém účtu (platby, uzavřené účty, zabezpečení) ti budou chodit dál. Rozmyslel(a) sis to? Napiš na ",
        incomplete: "Odkaz pro odhlášení je neúplný. Použij odkaz z e-mailu nebo napiš na support@fundly.games.",
        ask: function (e) { return "Přestat posílat propagační e-maily na " + e + "?"; },
        done: "Jsi odhlášen(a)", doneText: "Propagační e-maily ti už posílat nebudeme.", fail: "Odhlášení se nepodařilo.",
      } : {
        title: "Unsubscribe", text: "Stop receiving Fundly promotional emails?", btn: "Yes, unsubscribe me",
        foot: "You'll still receive service emails about your account (payments, closed accounts, security). Changed your mind? Write to ",
        incomplete: "This unsubscribe link is incomplete. Please use the link from the email or write to support@fundly.games.",
        ask: function (e) { return "Stop sending promotional emails to " + e + "?"; },
        done: "You're unsubscribed", doneText: "We won't send you promotional emails anymore.", fail: "Could not unsubscribe.",
      };
      // &type=weekly = jen týdenní přehled tipů (funkce weekly-report), ne propagační e-maily
      var WEEKLY = new URLSearchParams(location.search).get("type") === "weekly";
      if (WEEKLY) {
        var W = CS ? {
          title: "Odhlášení týdenního přehledu", text: "Přestat dostávat týdenní přehled tvých tipů?",
          foot: "Ostatní e-maily o tvém účtu ti budou chodit dál. Rozmyslel(a) sis to? Napiš na ",
          ask: function (e) { return "Přestat posílat týdenní přehled tipů na " + e + "?"; },
          done: "Týdenní přehled odhlášen", doneText: "Týdenní přehled ti už posílat nebudeme. Analýzu najdeš dál v dashboardu (Výkon → Analýza).",
        } : {
          title: "Unsubscribe from the weekly report", text: "Stop receiving the weekly summary of your tips?",
          foot: "You'll still receive other emails about your account. Changed your mind? Write to ",
          ask: function (e) { return "Stop sending the weekly tip report to " + e + "?"; },
          done: "Weekly report unsubscribed", doneText: "We won't send you the weekly report anymore. Your analytics stay in the dashboard (Performance → Analytics).",
        };
        for (var k in W) T[k] = W[k];
        document.title = T.title + " | Fundly";
      }
      if (CS) { document.documentElement.lang = "cs"; document.title = (WEEKLY ? T.title : "Odhlášení z e-mailů") + " | Fundly"; }
      document.getElementById("unsubTitle").textContent = T.title;
      document.getElementById("unsubText").textContent = T.text;
      var footEl = document.getElementById("unsubFoot");
      if (footEl) footEl.firstChild.textContent = T.foot;
      var q = new URLSearchParams(location.search);
      var email = q.get("e") || "", token = q.get("t") || "";
      var btn = document.getElementById("unsubBtn"), note = document.getElementById("unsubNote");
      btn.textContent = T.btn;
      if (!email || !token) {
        btn.hidden = true;
        note.textContent = T.incomplete;
        note.className = "auth-note mt error"; note.hidden = false;
        return;
      }
      document.getElementById("unsubText").textContent = T.ask(email);
      btn.addEventListener("click", async function () {
        btn.disabled = true;
        try {
          var res = await fetch(FUNDLY_SUPABASE_URL + "/functions/v1/email-unsubscribe", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify(WEEKLY ? { email: email, token: token, type: "weekly" } : { email: email, token: token }),
          });
          var data = await res.json().catch(function () { return {}; });
          if (!res.ok) throw new Error(CS ? T.fail : (data.error || T.fail));
          document.getElementById("unsubTitle").textContent = T.done;
          document.getElementById("unsubText").textContent = T.doneText;
          btn.hidden = true; note.hidden = true;
        } catch (e) {
          note.textContent = e.message || T.fail;
          note.className = "auth-note mt error"; note.hidden = false; btn.disabled = false;
        }
      });
    })();
  </script>
  <script src="js/legal-lang.js?v=20261119a"></script>
</body>
</html>
