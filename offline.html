<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#020204" />
  <title>Offline | Fundly</title>
  <style>
    html,body{height:100%;margin:0;background:#020204;color:#e8e8ee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif}
    main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
    img{width:72px;height:72px;border-radius:16px;margin-bottom:20px}
    h1{margin:0 0 8px;font-size:22px;color:#fff}
    p{margin:0 0 22px;color:#9a9aa8;max-width:320px;line-height:1.5}
    button{background:#14f195;color:#020204;border:0;border-radius:12px;padding:12px 22px;font-weight:700;font-size:15px}
  </style>
</head>
<body>
  <main>
    <img src="assets/icons/icon-192.png" alt="Fundly" />
    <h1>You're offline</h1>
    <p>Fundly needs an internet connection to show live odds and your account. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
